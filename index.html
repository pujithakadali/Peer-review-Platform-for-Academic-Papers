<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Peer Review Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>📚 Peer Review Platform</h1>

  <!-- Login -->
  <div class="mb-3">
    <h4>🔐 Login</h4>
    <input id="username" class="form-control mb-2" placeholder="Username">
    <input id="password" class="form-control mb-2" type="password" placeholder="Password">
    <button onclick="login()" class="btn btn-primary">Login</button>
    <p id="login-status" class="text-success mt-2"></p>
  </div>

  <!-- Upload Paper -->
  <div class="mb-4">
    <h4>📤 Upload Paper</h4>
    <input id="title" class="form-control mb-2" placeholder="Title">
    <textarea id="abstract" class="form-control mb-2" placeholder="Abstract"></textarea>
    <button onclick="uploadPaper()" class="btn btn-success">Upload</button>
    <p id="upload-status" class="text-info mt-2"></p>
  </div>

  <!-- List Papers -->
  <div>
    <h4>📄 Available Papers</h4>
    <ul id="paper-list" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
