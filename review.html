<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Submit Review</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h2>📝 Submit Review</h2>

  <input id="paper-id" class="form-control mb-2" placeholder="Paper ID">
  <input id="rating" class="form-control mb-2" type="number" placeholder="Rating (1-5)">
  <textarea id="comment" class="form-control mb-2" placeholder="Your comment"></textarea>
  <button onclick="submitReview()" class="btn btn-primary">Submit Review</button>
  <p id="review-status" class="mt-2"></p>

  <script>
    function submitReview() {
      const token = localStorage.getItem("access");
      fetch("http://127.0.0.1:8000/api/review/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          paper: document.getElementById("paper-id").value,
          rating: document.getElementById("rating").value,
          comment: document.getElementById("comment").value
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("review-status").innerText = "✅ Review submitted!";
      });
    }
  </script>
</body>
</html>
